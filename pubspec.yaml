name: studysphere
description: A study management app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 💾 Local storage & Database
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # 🔔 Notifications (using latest stable version)
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # 🌐 HTTP REQUESTS (AI + APIs)
  http: ^1.2.0

  # 🌐 Web + Files
  url_launcher: ^6.2.1
  file_picker: ^11.0.2
  path_provider: ^2.1.1

  # 📊 Charts & UI
  fl_chart: ^1.2.0

  # 📄 PDF viewer
  flutter_pdfview: ^1.3.2

  # 🔊 AUDIO & VOICE
  audioplayers: ^6.6.0
  record: ^6.2.0
  just_audio: ^0.10.5

  # 🔐 Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.jpg
    - assets/images/background.jpg
    - assets/sounds/alarm.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.jpg"